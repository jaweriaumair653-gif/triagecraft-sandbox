[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "triagecraft"
version = "0.1.0"
description = "GitHub App that reduces repetitive maintainer work."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.1",
  "pydantic>=2.7.0",
  "requests>=2.32.3",
  "python-dotenv>=1.0.1",
  "fastapi",
  "uvicorn",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.15.18",
  "black==26.5.1",
  "mypy==2.1.0",
  "types-PyYAML==6.0.12.20260518",
  "httpx2==2.5.0",
]

[project.scripts]
triagecraft = "triagecraft.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true