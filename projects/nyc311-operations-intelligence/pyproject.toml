[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc311-operations-intelligence"
version = "0.1.0"
description = "End-to-end NYC 311 service operations analytics, anomaly detection, and demand forecasting."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.0", "numpy>=1.26", "pandas>=2.2", "pyarrow>=15", "requests>=2.32", "scikit-learn>=1.5"]

[project.optional-dependencies]
dashboard = ["plotly>=5.20", "streamlit>=1.36"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
nyc311-intel = "nyc311_intelligence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
