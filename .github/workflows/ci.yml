name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install package and dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: Pytest
        run: pytest

      - name: MyPy
        run: mypy src

  docker:
    name: Build and smoke-test Docker image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t triagecraft:ci .

      - name: Start container
        run: |
          docker run -d \
            --name triagecraft-ci \
            -p 8000:8000 \
            -e TRIAGECRAFT_GITHUB_TOKEN=ci-smoke-test-token \
            triagecraft:ci

      - name: Wait for health endpoint
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs triagecraft-ci
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f triagecraft-ci
